<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forja Academia · Sistema de gestão (modelo Orbi)</title>
<meta name="description" content="Modelo de sistema de gestão feito pela Orbi para uma academia: membros, financeiro, planos, check-in, aulas e relatórios. Toque e use.">
<meta name="theme-color" content="#0B0B0E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0E;--p:#141419;--p2:#1B1B22;--ink:#EDEDF2;--mut:#9A9AA8;--or:#FF7A1A;--or2:#FFB067;--ok:#3DD68C;--bad:#FF5C5C;--d:"Unbounded",system-ui,sans-serif;--s:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--s);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--p2);border:0;border-radius:10px;min-height:42px;padding:0 12px;width:100%}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.demo{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:8px 16px;background:#C8FF3D;color:#0A1200;font:600 13px/1.3 var(--s);text-align:center}
.demo a{color:inherit;font-weight:800}
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100% - 34px)}
/* sidebar */
.side{position:sticky;top:0;height:100vh;padding:22px 14px;background:#0E0E12;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--or);display:grid;place-items:center;color:#1A0A00;font:800 16px/1 var(--d);font-style:normal}
.brand b{font:800 16px/1 var(--d);letter-spacing:-.03em}
.brand small{display:block;font:600 11px/1 var(--s);color:var(--mut);margin-top:3px;letter-spacing:.06em}
.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border-radius:10px;color:var(--mut);font-weight:600;text-align:left}
.nav button:hover{background:var(--p);color:var(--ink)}
.nav button[aria-current=page]{background:linear-gradient(90deg,rgba(255,122,26,.18),rgba(255,122,26,0));color:var(--or)} /* taste-skill-ignore: active nav state, product UI */
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
.side .motto{margin-top:auto;padding:16px 12px;font:800 13px/1.25 var(--d);color:#4A4A55;letter-spacing:-.02em}
.side .motto i{display:block;width:26px;height:3px;background:var(--or);margin-top:10px}
.user{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--p)}
.user i{width:32px;height:32px;border-radius:50%;background:#2A2A33;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.user small{display:block;color:var(--mut);font-size:12px}
/* main */
main{padding:22px 28px 90px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.search{flex:1;max-width:420px;position:relative}
.search input{padding-left:38px;background:var(--p)}
.search svg{position:absolute;left:12px;top:12px;width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2}
.top .sp{flex:1}
.pillx{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:10px;background:var(--p);color:var(--mut);font-weight:600;font-size:14px;white-space:nowrap}
.bell{position:relative;width:42px;height:42px;border-radius:10px;background:var(--p);display:grid;place-items:center}
.bell svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}
.bell b{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--or);color:#1A0A00;font-size:10px;display:grid;place-items:center}
.welcome{position:relative;overflow:hidden;border-radius:18px;min-height:150px;display:flex;align-items:center;padding:26px 28px;margin-bottom:18px;background:#000}
.welcome img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42}
.welcome div{position:relative}
.welcome small{color:var(--or2);font-weight:700}
.welcome h1{font:800 clamp(24px,3vw,36px)/1.05 var(--d);letter-spacing:-.04em;margin-top:6px}
.welcome p{color:#D7D7DF;margin-top:6px}
.grid{display:grid;gap:16px}
.k4{grid-template-columns:repeat(4,1fr)}
.c2{grid-template-columns:1.6fr 1fr}
.c2b{grid-template-columns:1fr 1fr}
.card{background:var(--p);border-radius:16px;padding:18px;min-width:0}
.card h3{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 14px/1.2 var(--s);color:var(--ink);margin-bottom:12px}
.card h3 span{color:var(--mut);font-weight:600;font-size:12px}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,122,26,.14);display:grid;place-items:center;flex:none}
.kpi .ic svg{width:22px;height:22px;stroke:var(--or);fill:none;stroke-width:2}
.kpi small{color:var(--mut);font-size:12px;font-weight:600}
.kpi b{display:block;font:700 24px/1.15 var(--d);letter-spacing:-.04em;margin:2px 0}
.up{color:var(--ok);font-size:12px;font-weight:700}.down{color:var(--bad);font-size:12px;font-weight:700}
svg.ch{width:100%;display:block}
.legend{display:grid;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.legend b{margin-left:auto}
.donut{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.rank{display:grid;gap:12px}
.rank div{display:grid;grid-template-columns:22px 90px 1fr 36px;gap:10px;align-items:center;font-size:13px}
.rank em{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--p2);display:grid;place-items:center;font-size:11px;font-weight:800}
.rank div:first-child em{background:var(--or);color:#1A0A00}
.bar{height:8px;border-radius:4px;background:var(--p2);overflow:hidden}.bar i{display:block;height:100%;background:var(--or);border-radius:4px;transition:width .8s}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-size:12px;font-weight:700;padding:10px 12px}
td{padding:12px;border-top:1px solid #22222A}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.t-ok{background:rgba(61,214,140,.14);color:var(--ok)}.t-bad{background:rgba(255,92,92,.14);color:var(--bad)}.t-or{background:rgba(255,122,26,.16);color:var(--or2)}.t-mut{background:var(--p2);color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;background:var(--or);color:#1A0A00;font-weight:800}
.btn.g{background:var(--p2);color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #22222A} /* taste-skill-ignore: data table rows */
.list>div:first-child{border-top:0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.who{display:flex;align-items:center;gap:10px}
.who small{display:block;color:var(--mut);font-size:12px}
.sched{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.slot{padding:12px;border-radius:12px;background:var(--p2);font-size:13px}
.slot b{display:block}.slot small{color:var(--mut)}
.slot .bar{margin-top:8px}
.toast{position:fixed;left:50%;top:18px;z-index:50;transform:translate(-50%,-160%);display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:#fff;color:#111;font-weight:700;font-size:14px;transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 16px 40px rgba(0,0,0,.5)} /* taste-skill-ignore: notification overlay */
.toast.on{transform:translate(-50%,0)}
.toast i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:none;place-items:center;padding:16px}
.modal.on{display:grid}
.modal .pn{width:min(440px,100%);background:var(--p);border-radius:18px;padding:22px;display:grid;gap:10px}
.modal h3{font:700 20px/1.1 var(--d);letter-spacing:-.03em;margin-bottom:6px}
.fade{animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.bnav{display:none}
.hideM{}
@media(max-width:1100px){.k4{grid-template-columns:1fr 1fr}.c2,.c2b{grid-template-columns:1fr}.sched{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){
  .app{grid-template-columns:1fr}.side{display:none}
  main{padding:16px 14px 96px}
  .top .pillx,.hideM{display:none}
  .k4{gap:10px}.card{padding:14px}.kpi .ic{display:none}.kpi b{font-size:20px}
  .donut{grid-template-columns:120px 1fr}
  .sched{grid-template-columns:1fr 1fr}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:#0E0E12;border-top:1px solid #22222A} /* taste-skill-ignore: app tab bar */
  .bnav button{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut);flex:1}
  .bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
  .bnav button[aria-current=page]{color:var(--or)}
  td,th{padding:10px 6px}
}
</style>
</head>
<body>
<div class="demo">Modelo de sistema feito pela Orbi · academia fictícia, dados de exemplo · toque e use <a href="https://wa.me/5535920059158?text=Oi!%20Vi%20o%20modelo%20do%20sistema%20de%20gest%C3%A3o%20e%20quero%20um%20para%20a%20minha%20empresa.">Quero um para a minha empresa</a></div>
<div class="app">
  <aside class="side" aria-label="Menu">
    <div class="brand"><i>F</i><div><b>FORJA</b><small>ACADEMIA</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="motto">Disciplina hoje,<br>resultado sempre.<i></i></div>
    <div class="user"><i>MR</i><div><b>Marcos R.</b><small>Administrador</small></div></div>
  </aside>
  <main id="main"></main>
</div>
<nav class="bnav" id="bnav" aria-label="Menu"></nav>
<div class="toast" id="toast" role="status"><i></i><span></span></div>
<div class="modal" id="modal"><div class="pn" id="pn"></div></div>

<script>
const $ = s => document.querySelector(s);
const brl = v => 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const num = v => v.toLocaleString('pt-BR');
const IC = {
 dash:'M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z', mem:'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M17 11a3 3 0 1 0 0-6M22 21a5 5 0 0 0-5-5',
 fin:'M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6', plan:'M4 4h16v16H4zM4 9h16M9 20V9', chk:'M9 11l3 3 8-8M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
 aula:'M3 4h18v18H3zM16 2v4M8 2v4M3 10h18', rel:'M4 20V10M10 20V4M16 20v-8M22 20H2', search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3', bell:'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0',
 money:'M2 7h20v10H2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', in:'M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3'
};
const svg = (d, cls='') => `<svg viewBox="0 0 24 24" class="${cls}"><path d="${d}"/></svg>`;
const PAGES = [['dash','Dashboard'],['mem','Membros'],['fin','Financeiro'],['plan','Planos'],['chk','Check-in'],['aula','Aulas'],['rel','Relatórios']];
const PLANS = [['Musculação',89.9,'#FF7A1A'],['Premium',149.9,'#FFB067'],['Aulas coletivas',109.9,'#3DD68C'],['Funcional',119.9,'#6C8CFF'],['Outros',69.9,'#5A5A66']];
const NAMES = ['Ana Souza','Bruno Lima','Carla Mendes','Diego Alves','Eduarda Reis','Felipe Costa','Gabi Rocha','Henrique Dias','Isabela Nunes','João Pedro','Karina Melo','Lucas Prado','Marina Teles','Nicolas Faria','Olívia Brito','Paulo Viana'];
const COLORS = ['#FF7A1A','#3DD68C','#6C8CFF','#FFB067','#E06CFF','#4FD1E8'];
const fresh = () => ({
  members: NAMES.map((n, i) => ({n, plan: i % 5, st: i % 7 === 3 ? 'atraso' : i % 9 === 5 ? 'inativo' : 'ativo', last: i % 4 === 0 ? 'hoje' : (i % 6 + 1) + 'd', since: 2021 + i % 5})),
  checkins: 102, total: 734, revenue: 93280, exp: [['Aluguel',18500],['Folha de pagamento',32400],['Energia',4120],['Manutenção',1890],['Marketing',2300]],
  bills: [['Fornecedor de suplementos',3240,'12/11'],['Internet',189.9,'15/11'],['Manutenção esteiras',1200,'18/11']]
});
let S; try { S = JSON.parse(localStorage.getItem('orbi-forja-v1')) || fresh(); } catch { S = fresh(); }
const save = () => localStorage.setItem('orbi-forja-v1', JSON.stringify(S));
let page = 'dash';
function toast(t){ const el = $('#toast'); el.lastElementChild.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2400); }
function modal(h){ $('#pn').innerHTML = h; $('#modal').classList.add('on'); }
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').classList.remove('on'); };

/* charts */
function line(vals, w=640, h=210){ const mx = 1000, pad = 28, step = (w - pad - 10) / (vals.length - 1);
  const pts = vals.map((v, i) => [pad + i * step, h - 24 - v / mx * (h - 44)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = d + ` L${pts.at(-1)[0]} ${h - 24} L${pad} ${h - 24} Z`;
  const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolução de membros ativos"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF7A1A" stop-opacity=".35"/><stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/></linearGradient></defs>` +
    [0,250,500,750,1000].map(v => { const y = h - 24 - v / mx * (h - 44); return `<line x1="${pad}" x2="${w}" y1="${y}" y2="${y}" stroke="#22222A"/><text x="0" y="${y + 4}" fill="#6A6A76" font-size="10">${v}</text>`; }).join('') +
    `<path d="${area}" fill="url(#lg)"/><path class="ln" d="${d}" fill="none" stroke="#FF7A1A" stroke-width="2.5" stroke-linejoin="round"/>` +
    pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#0B0B0E" stroke="#FF7A1A" stroke-width="2"/><text x="${p[0]}" y="${h - 6}" fill="#6A6A76" font-size="10" text-anchor="middle">${months[i]}</text>`).join('') + `</svg>`; }
function bars(vals, w=640, h=200){ const mx = Math.max(...vals) * 1.15, bw = (w - 40) / vals.length * .62, gap = (w - 40) / vals.length;
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" role="img" aria-label="Receita mensal">` + vals.map((v, i) => { const bh = v / mx * (h - 30), x = 30 + i * gap;
    return `<rect x="${x}" y="${h - 22 - bh}" width="${bw}" height="${bh}" rx="5" fill="${i === vals.length - 1 ? '#FF7A1A' : '#2A2A36'}"/><text x="${x + bw / 2}" y="${h - 6}" fill="#6A6A76" font-size="10" text-anchor="middle">${['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov'][i]}</text>`; }).join('') + `</svg>`; }
function donut(parts, center, sub){ const tot = parts.reduce((a, p) => a + p[1], 0); let acc = 0; const r = 52, c = 2 * Math.PI * r;
  return `<svg class="ch" viewBox="0 0 140 140" role="img" aria-label="Distribuição de planos">` + parts.map(p => { const len = p[1] / tot * c, off = c - acc; acc += len;
    return `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${p[2]}" stroke-width="16" stroke-dasharray="${len - 2} ${c - len + 2}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)"/>`; }).join('') +
    `<text x="70" y="70" text-anchor="middle" fill="#EDEDF2" font-size="22" font-weight="800" font-family="Unbounded">${center}</text><text x="70" y="88" text-anchor="middle" fill="#9A9AA8" font-size="10">${sub}</text></svg>`; }

function shell(){
  const items = PAGES.map(([id, l]) => `<button data-p="${id}" ${id === page ? 'aria-current="page"' : ''}>${svg(IC[id])}${l}</button>`).join('');
  $('#nav').innerHTML = items;
  $('#bnav').innerHTML = PAGES.filter(p => ['dash','mem','chk','fin','aula'].includes(p[0])).map(([id, l]) => `<button data-p="${id}" ${id === page ? 'aria-current="page"' : ''}>${svg(IC[id])}${l === 'Dashboard' ? 'Início' : l}</button>`).join('');
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { page = b.dataset.p; render(); scrollTo(0, 0); });
}
const topbar = () => `<div class="top"><label class="search">${svg(IC.search)}<input id="q" placeholder="Buscar membro, plano..." aria-label="Buscar membro"></label><span class="sp"></span><span class="pillx">Unidade Centro</span><span class="pillx hideM">${new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'})}</span><button class="bell" aria-label="Notificações">${svg(IC.bell)}<b>3</b></button></div>`;
function planCounts(){ const base = [360, 185, 123, 43, 23]; return PLANS.map((p, i) => [p[0], base[i], p[2]]); }

function render(){
  shell(); const m = $('#main'); m.classList.remove('fade'); void m.offsetWidth; m.classList.add('fade');
  const active = S.members.filter(x => x.st === 'ativo').length;
  if (page === 'dash') {
    const pc = planCounts();
    m.innerHTML = topbar() + `
    <section class="welcome"><img src="../img/gym.webp" alt="" width="1800" height="1198"><div><small>Bem-vindo de volta, Marcos</small><h1>Forja Academia</h1><p>Mais que uma academia. Uma comunidade de pessoas mais fortes.</p></div></section>
    <div class="grid k4">
      <div class="card kpi"><span class="ic">${svg(IC.mem)}</span><div><small>Membros ativos</small><b>${num(S.total)}</b><span class="up">↑ 2,8%</span> <small>vs. mês anterior</small></div></div>
      <div class="card kpi"><span class="ic">${svg(IC.money)}</span><div><small>Receita do mês</small><b>${brl(S.revenue).replace(',00','')}</b><span class="up">↑ 11,4%</span> <small>vs. mês anterior</small></div></div>
      <div class="card kpi"><span class="ic">${svg(IC.chk)}</span><div><small>Check-ins hoje</small><b id="kchk">${S.checkins}</b><span class="up">↑ 6,9%</span> <small>vs. ontem</small></div></div>
      <div class="card kpi"><span class="ic">${svg(IC.fin)}</span><div><small>Inadimplência</small><b>3,1%</b><span class="down">↓ 0,8 pp</span> <small>vs. mês anterior</small></div></div>
    </div>
    <div class="grid c2" style="margin-top:16px">
      <div class="card"><h3>Evolução de membros ativos <span>últimos 12 meses</span></h3>${line([420,455,470,512,540,566,590,604,640,672,705,734])}</div>
      <div class="card"><h3>Distribuição de planos <span>${num(pc.reduce((a, p) => a + p[1], 0))} membros</span></h3><div class="donut">${donut(pc, num(S.total), 'membros')}<div class="legend">${pc.map(p => `<div><i style="background:${p[2]}"></i>${p[0]}<b>${p[1]}</b></div>`).join('')}</div></div></div>
    </div>
    <div class="grid c2" style="margin-top:16px">
      <div class="card"><h3>Receita mensal <span>2026</span></h3>${bars([61,64,66,70,72,75,79,80,84,86,93.28])}</div>
      <div class="card"><h3>Aulas mais frequentadas <span>esta semana</span></h3><div class="rank">${[['Musculação',268],['Funcional',176],['Spinning',142],['Pilates',98],['HIIT',76]].map((a, i) => `<div><em>${i + 1}</em><span>${a[0]}</span><span class="bar"><i style="width:${a[1] / 268 * 100}%"></i></span><b>${a[1]}</b></div>`).join('')}</div></div>
    </div>`;
  }
  if (page === 'mem') {
    m.innerHTML = topbar() + `<div class="row" style="margin-bottom:14px"><h2 style="font:800 26px/1 var(--d);letter-spacing:-.04em">Membros</h2><button class="btn" id="add">+ Novo membro</button></div>
    <div class="card" style="padding:6px 6px 0;overflow-x:auto"><table><thead><tr><th>Nome</th><th>Plano</th><th class="hideM">Desde</th><th class="hideM">Último treino</th><th>Situação</th></tr></thead><tbody id="tb"></tbody></table></div>`;
    const fill = f => { $('#tb').innerHTML = S.members.filter(x => x.n.toLowerCase().includes(f)).map((x, i) => `<tr><td><span class="who"><span class="av" style="background:${COLORS[i % 6]}22;color:${COLORS[i % 6]}">${x.n.split(' ').map(w => w[0]).join('')}</span>${x.n}</span></td><td>${PLANS[x.plan][0]}</td><td class="hideM">${x.since}</td><td class="hideM">${x.last}</td><td><span class="tag ${x.st === 'ativo' ? 't-ok' : x.st === 'atraso' ? 't-bad' : 't-mut'}">${x.st === 'atraso' ? 'Em atraso' : x.st[0].toUpperCase() + x.st.slice(1)}</span></td></tr>`).join(''); };
    fill(''); $('#q').oninput = e => fill(e.target.value.toLowerCase());
    $('#add').onclick = () => { modal(`<h3>Novo membro</h3><form id="fm" style="display:grid;gap:10px"><input name="n" placeholder="Nome completo" required><select name="p">${PLANS.map((p, i) => `<option value="${i}">${p[0]} · ${brl(p[1])}/mês</option>`).join('')}</select><button class="btn">Cadastrar</button></form>`);
      $('#fm').onsubmit = e => { e.preventDefault(); const f = new FormData(e.target); S.members.unshift({n:f.get('n'), plan:+f.get('p'), st:'ativo', last:'—', since:2026}); S.total++; save(); $('#modal').classList.remove('on'); render(); toast(`${f.get('n')} cadastrado · cobrança mensal criada`); }; };
  }
  if (page === 'fin') {
    const out = S.exp.reduce((a, e) => a + e[1], 0);
    m.innerHTML = topbar() + `<h2 style="font:800 26px/1 var(--d);letter-spacing:-.04em;margin-bottom:14px">Financeiro</h2>
    <div class="grid k4"><div class="card kpi"><div><small>Entradas</small><b style="color:var(--ok)">${brl(S.revenue).replace(',00','')}</b></div></div><div class="card kpi"><div><small>Saídas</small><b style="color:var(--bad)">${brl(out).replace(',00','')}</b></div></div><div class="card kpi"><div><small>Lucro do mês</small><b>${brl(S.revenue - out).replace(',00','')}</b></div></div><div class="card kpi"><div><small>A receber (atrasos)</small><b>${brl(S.members.filter(x => x.st === 'atraso').length * 109.9)}</b></div></div></div>
    <div class="grid c2b" style="margin-top:16px">
      <div class="card"><h3>Contas a pagar <span>${S.bills.length} abertas</span></h3><div class="list">${S.bills.length ? S.bills.map((b, i) => `<div><span>${b[0]}<br><small style="color:var(--mut)">vence ${b[2]} · ${brl(b[1])}</small></span><button class="tag t-or" data-pay="${i}">Pagar</button></div>`).join('') : '<div><span style="color:var(--mut)">Tudo pago.</span></div>'}</div></div>
      <div class="card"><h3>Despesas do mês</h3><div class="rank">${S.exp.map((e, i) => `<div style="grid-template-columns:1fr 1fr 90px"><span>${e[0]}</span><span class="bar"><i style="width:${e[1] / 32400 * 100}%"></i></span><b style="text-align:right">${brl(e[1]).replace(',00','')}</b></div>`).join('')}</div></div>
    </div>
    <div class="card" style="margin-top:16px"><h3>Cobrança automática <span>todo dia 5</span></h3><div class="row"><span style="color:var(--mut)">Os membros recebem o Pix da mensalidade no WhatsApp. Quem atrasa ganha um lembrete sozinho.</span><button class="btn g" id="cob">Enviar lembretes (${S.members.filter(x => x.st === 'atraso').length})</button></div></div>`;
    document.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => { const x = S.bills.splice(+b.dataset.pay, 1)[0]; S.exp.push([x[0], x[1]]); save(); render(); toast(`${x[0]} pago · ${brl(x[1])}`); });
    $('#cob').onclick = () => toast('Lembretes enviados no WhatsApp');
  }
  if (page === 'plan') {
    const pc = planCounts();
    m.innerHTML = topbar() + `<h2 style="font:800 26px/1 var(--d);letter-spacing:-.04em;margin-bottom:14px">Planos</h2><div class="grid k4">${PLANS.slice(0, 4).map((p, i) => `<div class="card"><small style="color:var(--mut)">${pc[i][1]} membros</small><h3 style="font:700 20px/1.1 var(--d);margin:6px 0 4px;letter-spacing:-.03em">${p[0]}</h3><b style="font:800 26px/1 var(--d);color:${p[2]}">${brl(p[1])}</b><small style="color:var(--mut)"> /mês</small></div>`).join('')}</div>`;
  }
  if (page === 'chk') {
    m.innerHTML = topbar() + `<div class="row" style="margin-bottom:14px"><h2 style="font:800 26px/1 var(--d);letter-spacing:-.04em">Check-in</h2><span class="tag t-ok" style="font-size:14px">${S.checkins} hoje</span></div>
    <div class="card"><h3>Liberar entrada <span>ou pelo QR Code na recepção</span></h3><div class="list">${S.members.slice(0, 8).map((x, i) => `<div><span class="who"><span class="av" style="background:${COLORS[i % 6]}22;color:${COLORS[i % 6]}">${x.n.split(' ').map(w => w[0]).join('')}</span><span>${x.n}<small>${PLANS[x.plan][0]}</small></span></span>${x.st === 'atraso' ? '<span class="tag t-bad">Bloqueado · em atraso</span>' : x.in ? `<span class="tag t-ok">Entrou ${x.in}</span>` : `<button class="btn" data-in="${i}" style="min-height:36px">Check-in</button>`}</div>`).join('')}</div></div>`;
    document.querySelectorAll('[data-in]').forEach(b => b.onclick = () => { const x = S.members[+b.dataset.in]; x.in = new Date().toTimeString().slice(0, 5); x.last = 'hoje'; S.checkins++; save(); render(); toast(`${x.n} entrou às ${x.in}`); });
  }
  if (page === 'aula') {
    const A = [['Seg','Spinning','07:00',18,20],['Seg','Funcional','18:30',22,25],['Ter','Pilates','08:00',9,12],['Ter','HIIT','19:00',20,20],['Qua','Spinning','07:00',14,20],['Qua','Funcional','18:30',25,25],['Qui','Pilates','08:00',11,12],['Qui','HIIT','19:00',16,20],['Sex','Spinning','07:00',19,20],['Sex','Funcional','18:00',21,25]];
    m.innerHTML = topbar() + `<h2 style="font:800 26px/1 var(--d);letter-spacing:-.04em;margin-bottom:14px">Aulas da semana</h2><div class="sched">${A.map((a, i) => `<button class="slot" data-a="${i}" style="text-align:left"><small>${a[0]} · ${a[2]}</small><b>${a[1]}</b><small>${a[3]}/${a[4]} vagas</small><span class="bar"><i style="width:${a[3] / a[4] * 100}%;${a[3] >= a[4] ? 'background:var(--bad)' : ''}"></i></span></button>`).join('')}</div>`;
    document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { const a = A[+b.dataset.a]; toast(a[3] >= a[4] ? `${a[1]} de ${a[0]} lotada · lista de espera aberta` : `Vaga reservada em ${a[1]} (${a[0]} ${a[2]})`); });
  }
  if (page === 'rel') {
    m.innerHTML = topbar() + `<h2 style="font:800 26px/1 var(--d);letter-spacing:-.04em;margin-bottom:14px">Relatórios</h2>
    <div class="grid c2b"><div class="card"><h3>Receita por mês</h3>${bars([61,64,66,70,72,75,79,80,84,86,93.28])}</div><div class="card"><h3>Resumo de novembro</h3><div class="list"><div><span>Novos membros</span><b>48</b></div><div><span>Cancelamentos</span><b>12</b></div><div><span>Ticket médio</span><b>${brl(127.08)}</b></div><div><span>Horário de pico</span><b>18h às 20h</b></div><div><span>Frequência média</span><b>3,4 treinos/semana</b></div></div><button class="btn g" style="margin-top:14px;width:100%" onclick="toast('Relatório enviado no seu WhatsApp')">Mandar no meu WhatsApp</button></div></div>`;
  }
}
render();
setTimeout(() => { S.checkins++; save(); const k = $('#kchk'); if (k) k.textContent = S.checkins; toast('Check-in: Ana Souza · 18:02'); }, 3000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
